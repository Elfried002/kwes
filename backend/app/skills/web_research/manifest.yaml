name: web_research
version: 1.1.0
description: Recherche web multi-fournisseurs (SearXNG, DuckDuckGo, Wikipédia), extraction HTML/PDF et registre de preuves
entrypoint: skill.py
permissions:
  - web.search
  - web.read
risk_level: R0
network:
  mode: allowlist
  domains: []
resources:
  timeout_seconds: 45
  memory_mb: 512
  cpu_limit: 1
approval:
  required_for:
    - external_publish
