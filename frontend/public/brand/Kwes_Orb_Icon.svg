<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Kwes Orb</title><desc id="desc">A luminous blue-violet orb with a sound-wave mark.</desc>
<defs>
 <radialGradient id="orb" cx="35%" cy="28%" r="75%">
  <stop offset="0" stop-color="#5CE7FF"/><stop offset=".34" stop-color="#267BFF"/>
  <stop offset=".72" stop-color="#3127A8"/><stop offset="1" stop-color="#100B32"/>
 </radialGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#8CF4FF"/><stop offset=".48" stop-color="#657BFF"/><stop offset="1" stop-color="#D16BFF"/>
 </linearGradient>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
</defs>
<circle cx="256" cy="256" r="190" fill="url(#orb)" stroke="url(#edge)" stroke-width="8"/>
<path d="M96 284c45-43 83-43 123-8s80 44 118 9 65-40 82-22" fill="none" stroke="url(#edge)" stroke-width="12" stroke-linecap="round" opacity=".9"/>
<g fill="#F7FBFF" filter="url(#glow)">
 <rect x="169" y="226" width="24" height="60" rx="12"/>
 <rect x="211" y="194" width="24" height="124" rx="12"/>
 <rect x="253" y="218" width="24" height="76" rx="12"/>
 <rect x="295" y="184" width="24" height="144" rx="12"/>
 <rect x="337" y="226" width="24" height="60" rx="12"/>
</g>
<ellipse cx="256" cy="466" rx="142" ry="15" fill="none" stroke="#6B58FF" stroke-width="5" opacity=".75"/>
</svg>