# =============================================================================
# Kwes — infra/docker-compose.yml
#
# Cible : VPS Ubuntu 24.04 (4 vCPU / 8 Go), Docker Engine 27+ / Compose v2.
#
# Deux modes, un seul fichier :
#   * local complet    : docker compose --profile local up -d --build
#                        (PostgreSQL 16 + pgvector dans un conteneur jetable)
#   * production       : docker compose up -d --build
#                        (PostgreSQL = Supabase managé, cf. DATABASE_URL ;
#                         le service `postgres` est alors exclu par son profil)
#
# Principes :
#   * aucun port publié pour postgres / redis / backend / worker ;
#   * seul le reverse proxy expose 80/443 ;
#   * healthchecks + dépendances conditionnelles ;
#   * volumes nommés, réseau `internal` sans sortie Internet ;
#   * secrets lus depuis ../.env (jamais dans ce fichier).
#
# Variables attendues : voir .env.example à la racine du dépôt.
# =============================================================================

name: kwes

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-restart: &default-restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + pgvector — profil `local` uniquement.
  # En production Alpha, la base est Supabase (docs/10-infrastructure/
  # VPS_DEPLOYMENT.md §3). Aucun port publié : accès via le réseau interne.
  # ---------------------------------------------------------------------------
  postgres:
    <<: *default-restart
    profiles: ["local"]
    image: pgvector/pgvector:pg16
    container_name: kwes-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kwes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kwes}
      POSTGRES_DB: ${POSTGRES_DB:-kwes}
      # Collation stable et tri déterministe
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - log_min_duration_statement=500
      - -c
      - timezone=UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Appliquées dans l'ordre lexicographique au premier démarrage
      # (uniquement si le volume est vide). Supabase fournit auth.uid() ;
      # ici le shim local l'émule pour rendre le schéma rejouable.
      - ../supabase/local/0000_local_auth_shim.sql:/docker-entrypoint-initdb.d/00_auth_shim.sql:ro
      - ../supabase/migrations/0001_init.sql:/docker-entrypoint-initdb.d/10_init.sql:ro
      - ../supabase/migrations/0002_rls.sql:/docker-entrypoint-initdb.d/20_rls.sql:ro
      - ../supabase/migrations/0003_seed_skills.sql:/docker-entrypoint-initdb.d/30_seed_skills.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kwes} -d ${POSTGRES_DB:-kwes} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal
    logging: *default-logging
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # Redis 7 — file de tâches, rate limiting, heartbeat worker.
  # Jamais exposé publiquement (réseau `internal` uniquement).
  # ---------------------------------------------------------------------------
  redis:
    <<: *default-restart
    image: redis:7-alpine
    container_name: kwes-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      - --save
      - "900 1"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - internal
    logging: *default-logging
    mem_limit: 640m
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # API FastAPI (uvicorn). Point d'application des politiques.
  # ---------------------------------------------------------------------------
  backend:
    <<: *default-restart
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: kwes/backend:${KWES_VERSION:-dev}
    container_name: kwes-backend
    env_file:
      - ../.env
    environment:
      # Surcharges réseau : noms de services Docker, pas 127.0.0.1.
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql+psycopg://kwes:kwes@postgres:5432/kwes}
      REDIS_URL: ${CONTAINER_REDIS_URL:-redis://redis:6379/0}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      TZ: UTC
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
        required: false      # absent en prod (base = Supabase managé)
      redis:
        condition: service_healthy
    volumes:
      - appdata:/app/data
    expose:
      - "8000"               # visible du proxy uniquement, jamais publié
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5) as r:
                  sys.exit(0 if r.status < 400 else 1)
          except Exception:
              sys.exit(1)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - internal
      - edge
    logging: *default-logging
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

  # ---------------------------------------------------------------------------
  # Worker — même image, commande différente. Exécute les missions longues.
  # Pas de healthcheck HTTP : le heartbeat est publié dans Redis
  # (`GET kwes:worker:heartbeat`), surveillé par infra/scripts/healthcheck.sh.
  # ---------------------------------------------------------------------------
  worker:
    <<: *default-restart
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: kwes/backend:${KWES_VERSION:-dev}
    container_name: kwes-worker
    command: ["sh", "-c", "${WORKER_COMMAND:-python -m app.worker}"]
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql+psycopg://kwes:kwes@postgres:5432/kwes}
      REDIS_URL: ${CONTAINER_REDIS_URL:-redis://redis:6379/0}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      TZ: UTC
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    volumes:
      - appdata:/app/data
    networks:
      - internal
      - edge                 # accès sortant aux APIs LLM / ElevenLabs
    logging: *default-logging
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 60s

  # ---------------------------------------------------------------------------
  # Reverse proxy Nginx — seul service exposé (80/443).
  # ---------------------------------------------------------------------------
  proxy:
    <<: *default-restart
    image: nginx:1.27-alpine
    container_name: kwes-proxy
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # kwes.conf est un template : l'entrypoint nginx substitue ${KWES_DOMAIN}.
      - ./nginx/kwes.conf:/etc/nginx/templates/kwes.conf.template:ro
      - ./nginx/00-zones.conf:/etc/nginx/conf.d/00-zones.conf:ro
      - ./nginx/empty.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/letsencrypt
      - nginx_acme:/var/www/certbot
      - nginx_cache:/var/cache/nginx
    environment:
      KWES_DOMAIN: ${KWES_DOMAIN:-localhost}
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edge
    logging: *default-logging
    mem_limit: 256m

volumes:
  pgdata:
  redisdata:
  appdata:
  nginx_certs:
  nginx_acme:
  nginx_cache:

networks:
  # Sortie Internet autorisée (proxy, appels LLM)
  edge:
    driver: bridge
  # Aucune sortie Internet : base, cache, communications internes
  internal:
    driver: bridge
    internal: true
