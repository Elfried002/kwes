# =============================================================================
# Kwes — infra/nginx/00-zones.conf
# Directive de contexte `http` : maps, zones de rate limiting, logs JSON, gzip.
# Chargé avant kwes.conf (ordre alphabétique de conf.d).
# =============================================================================

# --- WebSocket (le backend expose /api/v1/ws) --------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Rate limiting -----------------------------------------------------------
# Volontairement généreux : le backend applique aussi ses propres limites.
limit_req_zone $binary_remote_addr zone=kwes_chat:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=kwes_api:10m  rate=300r/m;
limit_req_zone $binary_remote_addr zone=kwes_auth:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=kwes_conn:10m;

# --- Détection du client réel (derrière le proxy) ----------------------------
# (à n'activer que si un CDN/LB est devant ; sinon laisser la valeur par défaut)

# --- Logs structurés JSON (docs/10-infrastructure/OBSERVABILITY_BACKUP.md §1)
log_format kwes_json escape=json
    '{'
      '"time":"$time_iso8601",'
      '"request_id":"$request_id",'
      '"remote_addr":"$remote_addr",'
      '"method":"$request_method",'
      '"uri":"$uri",'
      '"status":$status,'
      '"bytes":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_time":"$upstream_response_time",'
      '"upstream_status":"$upstream_status",'
      '"http_referer":"$http_referer",'
      '"user_agent":"$http_user_agent",'
      '"host":"$host",'
      '"proto":"$server_protocol"'
    '}';

access_log /var/log/nginx/kwes_access.log kwes_json;
error_log  /var/log/nginx/error.log warn;

# --- Compression -------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 512;
gzip_comp_level 5;
gzip_types
    application/json
    application/javascript
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

server_tokens off;

# Taille maximale d'URI / d'en-têtes (anti-abus)
large_client_header_buffers 4 16k;
client_header_timeout 20s;
client_body_timeout 30s;
send_timeout 60s;
