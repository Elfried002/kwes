# =============================================================================
# Kwes — infra/nginx/kwes.conf
# Reverse proxy public : TLS, en-têtes de sécurité, WebSocket, streaming SSE.
#
# Monté comme TEMPLATE (/etc/nginx/templates/kwes.conf.template) : l'entrypoint
# de l'image nginx substitue ${KWES_DOMAIN} puis écrit conf.d/kwes.conf.
# Les variables nginx ($host, $request_uri...) ne sont pas affectées.
#
# TLS : certificats Let's Encrypt pour ${KWES_DOMAIN}. Amorce avec
#   infra/scripts/bootstrap_tls.sh   (auto-signé, puis certbot).
# =============================================================================

upstream kwes_backend {
    server backend:8000;
    keepalive 32;
    keepalive_timeout 75s;
}

# --- HTTP : redirection HTTPS, ACME et sonde de santé ------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ${KWES_DOMAIN};

    # Sonde locale (healthcheck du conteneur proxy), jamais redirigée
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Renouvellement ACME (HTTP-01)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # Tout le reste en HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${KWES_DOMAIN};

    # --- TLS ---------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/${KWES_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${KWES_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:kwes_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --- En-têtes de sécurité ----------------------------------------------
    # HSTS : 2 ans. À n'activer qu'une fois le HTTPS validé (le preload est
    # irréversible côté navigateurs) — retirer `preload` si hésitation.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    # API pure JSON : aucune ressource chargée par le navigateur.
    # (La CSP de la PWA est servie par Vercel, cf. docs/deploiement_vercel.md.)
    add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    # --- Limites globales ---------------------------------------------------
    client_max_body_size 25m;          # uploads/pièces jointes raisonnables
    client_body_buffer_size 256k;
    limit_conn kwes_conn 40;

    # Timeouts adaptés au streaming LLM (réponses longues)
    proxy_connect_timeout 10s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;

    # --- Interdits ----------------------------------------------------------
    location ~ /\.(env|git|svn|hg|DS_Store) {
        deny all;
        access_log off;
        return 404;
    }

    # --- Santé / version ----------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # /health est exposé par le backend sans authentification (contrat)
    location = /health {
        proxy_pass http://kwes_backend/health;
        proxy_http_version 1.1;
        access_log off;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket temps réel ----------------------------------------------
    location = /api/v1/ws {
        proxy_pass http://kwes_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- Chat : streaming SSE, pas de bufferisation -------------------------
    location = /api/v1/chat {
        limit_req zone=kwes_chat burst=10 nodelay;
        proxy_pass http://kwes_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;                       # ne pas compresser un flux déjà chunked
        chunked_transfer_encoding on;
    }

    # --- Authentification (limite plus stricte) -----------------------------
    location ^~ /api/v1/auth/ {
        limit_req zone=kwes_auth burst=5 nodelay;
        proxy_pass http://kwes_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # --- API générique -------------------------------------------------------
    location /api/ {
        limit_req zone=kwes_api burst=60 nodelay;
        proxy_pass http://kwes_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_buffering on;
    }

    # --- Racine : le frontend vit sur Vercel, on documente l'API ------------
    location = / {
        default_type application/json;
        return 200 '{"service":"kwes-api","status":"ok","docs":"/api/v1/health"}\n';
    }

    location / {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"Route inconnue","details":{}}}\n';
    }

    # --- Journalisation ------------------------------------------------------
    access_log /var/log/nginx/kwes_access.log kwes_json;
    error_log  /var/log/nginx/error.log warn;
}
